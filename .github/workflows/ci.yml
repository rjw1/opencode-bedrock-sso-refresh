name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # package-lock.json is gitignored, so there is nothing for `npm ci` to
      # install from; use a plain install instead.
      - run: npm install
      - run: npm run typecheck
      - run: npm test
